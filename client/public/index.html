<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target Tracker</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="pip-container">
        <div id="pip-header">
          <span id="pip-title">RTMS FEED</span>
          <span id="pip-status" class="pip-status-connecting">CONNECTING</span>
          <button id="pip-toggle">▼</button>
        </div>
        <canvas id="pip-canvas"></canvas>
      </div>

      <div id="sidebar-header">
        <span id="sidebar-title">TRACKER</span>
        <span id="connection-status" class="status-disconnected">DISCONNECTED</span>
      </div>
      <div id="sidebar-tabs">
        <button class="tab-btn active" data-tab="targets">TARGETS</button>
        <button class="tab-btn" data-tab="assets">ASSETS</button>
      </div>
      <div id="sidebar-toolbar">
        <button id="populate-btn">+ POPULATE</button>
      </div>
      <div id="list-area">
        <div id="target-list"></div>
        <div id="asset-list" style="display:none"></div>
      </div>

      <div id="messages-section">
        <div id="messages-header">
          <span id="messages-title">MESSAGES</span>
          <span id="messages-unread" class="messages-unread hidden">0</span>
        </div>
        <div id="message-list"></div>
      </div>
    </aside>

    <div id="map-container">
      <div id="map"></div>

      <div id="basemap-selector">
        <button class="basemap-btn" data-style="dark-topo">DARK</button>
        <button class="basemap-btn" data-style="outdoors">TOPO</button>
        <button class="basemap-btn active" data-style="satellite">SAT</button>
      </div>

      <button id="sim-btn">SIM</button>
      <button id="out-sim-btn">OUT SIM</button>

    </div>
  </div>

  <script src="jsmpeg.min.js"></script>
  <script src="target-repo.js"></script>
  <script src="app.js"></script>
</body>
</html>
